<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#282039">
<title>Bookshelf Scanner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Abel&amp;display=swap">
<style>
:root { color-scheme: light; --ink:#292238; --muted:#655d71; --plum:#773867; --line:#e5dce9; --paper:#f7f4f8; }
* { box-sizing:border-box; }
body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui,sans-serif; }
.masthead { background:#282039; color:white; border-bottom:4px solid #ad76a7; }
.masthead-inner { max-width:1100px; margin:auto; padding:clamp(22px,5vw,48px) clamp(16px,4vw,32px); }
h1,h2 { font-family:Abel,"Arial Narrow",sans-serif; font-weight:400; line-height:1.1; margin:0; }
h1 { font-size:clamp(2.2rem,6vw,3.8rem); }
h2 { font-size:1.65rem; }
.masthead p { margin:6px 0 0; color:#ecdaef; }
main { display:grid; grid-template-columns:minmax(0,1.65fr) minmax(0,1fr); gap:16px; max-width:1100px; margin:0 auto; padding:clamp(14px,3vw,30px); align-items:start; }
.sidebar { display:grid; gap:16px; }
.card { min-width:0; background:#fff; border:1px solid var(--line); border-radius:12px; padding:clamp(12px,2vw,20px); }
.actions,.section-heading { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.section-heading { justify-content:space-between; margin-bottom:12px; }
.camera-actions { margin:12px 0 0; }
button,input { font:inherit; min-height:44px; border-radius:7px; }
button { border:1px solid #d5c5db; color:#4f3157; background:#f7f0f8; padding:7px 12px; cursor:pointer; font-weight:600; }
button:hover:not(:disabled) { background:#eee0f1; }
button.primary { background:var(--plum); color:white; border-color:var(--plum); }
button.primary:hover:not(:disabled) { background:#602953; }
button:disabled { opacity:.48; cursor:default; }
:focus-visible { outline:3px solid #5068a9; outline-offset:2px; }
input { min-width:0; width:100%; padding:8px 12px; border:1px solid #b9a9c1; color:var(--ink); background:white; }
input[type=range] { accent-color:var(--plum); width:min(220px,70%); vertical-align:middle; }
#zoomWrap { margin-top:6px; }
#video { display:block; background:#201b2b; width:100%; aspect-ratio:4/3; max-height:460px; border-radius:8px; object-fit:cover; }
#status,#bridgeStatus,#saveStatus { margin:8px 0; color:var(--muted); font-size:.91rem; overflow-wrap:anywhere; }
#saveStatus:not(:empty) { padding:8px 10px; background:#f1e9f4; border-radius:6px; color:#4f3157; }
#saveStatus:empty { margin:0; }
#bridgeHolder iframe { display:block; width:100%; height:170px; border:1px solid var(--line); border-radius:8px; background:#f7f2f8; }
#manual { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:8px; }
#list { margin:10px 0 0; padding-inline-start:1.6rem; font-variant-numeric:tabular-nums; }
#list:empty { display:none; }
#list li { padding:5px 0; border-top:1px solid var(--line); }
#count { font:600 .88rem system-ui,sans-serif; color:var(--plum); background:#f1e9f4; padding:5px 9px; border-radius:20px; }
#clear { color:#873453; }
footer { max-width:1100px; margin:auto; padding:0 clamp(16px,4vw,32px) 20px; color:var(--muted); }
@media (max-width:730px) { main { grid-template-columns:1fr; gap:12px; } .sidebar { gap:12px; } }
</style>
</head>
<body>
<header class="masthead"><div class="masthead-inner">
  <h1>Bookshelf Scanner</h1>
  <p>Scan book barcodes into your home library.</p>
</div></header>
<main>
  <section class="card" aria-labelledby="cameraHeading">
    <h2 id="cameraHeading">Scan a barcode</h2>
    <div class="actions camera-actions">
      <button id="start" class="primary">Start camera</button>
      <button id="stop" disabled>Stop</button>
      <button id="refocus" disabled>Refocus</button>
    </div>
    <label id="zoomWrap" style="display:none">Zoom <input id="zoom" type="range" min="1" max="3" step=".1" value="1"></label>
    <p id="status" role="status">Ready.</p>
    <video id="video" autoplay muted playsinline></video>
  </section>
  <div class="sidebar">
    <section class="card" aria-labelledby="connectionHeading">
      <div class="section-heading"><h2 id="connectionHeading">Google Sheets</h2><button id="connectBridge">Connect library</button></div>
      <p id="bridgeStatus" role="status">Scans are saved on this device.</p>
      <div id="bridgeHolder"></div><p id="saveStatus" role="status"></p>
    </section>
    <section class="card">
      <div class="section-heading"><h2><label for="isbn">Manual ISBN</label></h2></div>
      <form id="manual"><input id="isbn" placeholder="978…" inputmode="numeric" required><button class="primary">Add</button></form>
    </section>
    <section class="card" aria-labelledby="historyHeading">
      <div class="section-heading"><h2 id="historyHeading">Scan history</h2><span id="count" aria-label="Scan count">0</span></div>
      <div class="actions"><button id="export">Export CSV</button><button id="copy">Copy ISBNs</button><button id="clear">Clear</button></div>
      <ol id="list"></ol>
    </section>
  </div>
</main>
<footer><small>Camera frames stay on this device. Scan history is kept here as a backup.</small></footer>
<script>
const el=id=>document.getElementById(id),key='bookshelf-isbns-v1';
let scans=[];try{scans=JSON.parse(localStorage.getItem(key)||'[]')}catch{}
let stream=null,reader=null,active=false,last='',lastTime=0,pauseUntil=0,cameraTrack=null,focusCapabilities={};
const bridgeUrl = 'https://script.google.com/macros/s/AKfycbxPwoz7VH1KIlWV-hYRMdDS4ljhsy6cjRDEakx2ClyHb2VP4YaxVgj6dSJJ-jyAEqD4/exec';
const bridgeContentOrigin = 'https://n-nt5rpprokaysvrzowymfzfcos7o3266ijrawbsi-0lu-script.googleusercontent.com';
let bridgeFrame, bridgeWindow, bridgeReady, bridgeTimer;
let requestNum = 0;
const pending = new Map();
function say(s){el('status').textContent=s}
function render(){el('count').textContent=scans.length;el('list').replaceChildren();for(const x of [...scans].reverse().slice(0,40)){const li=document.createElement('li');li.textContent=x.isbn;el('list').append(li)}}
function valid(s){if(!/^\d{13}$/.test(s)||!/^97[89]/.test(s))return false;let sum=0;for(let i=0;i<12;i++)sum+=Number(s[i])*(i%2?3:1);return (10-sum%10)%10===Number(s[12])}
function saveToLibrary(isbn) {
  const status = el('saveStatus');
  if (!bridgeReady || !bridgeWindow) {
    status.textContent = isbn + ' saved on this phone. Connect Google Sheets to save future scans.';
    return;
  }
  if ([...pending.values()].some(request => request.isbn === isbn)) return;
  const id = String(++requestNum);
  const timer = setTimeout(() => {
    pending.delete(id);
    status.textContent = 'No Google Sheets confirmation for ' + isbn + '. You can enter it again to retry.';
  }, 60000);
  pending.set(id, {isbn, timer});
  bridgeWindow.postMessage({source:'bookshelf-scanner',type:'save',id,isbn}, bridgeContentOrigin);
  status.textContent = 'Saving ' + isbn + ' to Google Sheets…';
}
function add(raw, retry = false){const s=String(raw).replace(/[\s-]/g,'');if(!valid(s)){say('Not a valid ISBN-13: '+s);return}if(scans.some(x=>x.isbn===s)){say('Already scanned: '+s);if(retry&&bridgeReady)saveToLibrary(s);return}pauseUntil=Date.now()+2000;scans.push({isbn:s,at:new Date().toISOString()});localStorage.setItem(key,JSON.stringify(scans));render();saveToLibrary(s);setTimeout(()=>{if(active&&Date.now()>=pauseUntil)say('Ready — scan next book')},2050);navigator.vibrate?.(80)}
async function stop(){active=false;el('refocus').disabled=true;el('zoomWrap').style.display='none';cameraTrack=null;reader?.reset();reader=null;stream?.getTracks().forEach(t=>t.stop());stream=null;el('video').srcObject=null;el('start').disabled=false;el('stop').disabled=true}
function found(s){if(Date.now()<pauseUntil)return;if(!/^97[89]\d{10}$/.test(s))return;const now=Date.now();if(s===last&&now-lastTime<2500)return;last=s;lastTime=now;add(s)}
async function scanNative(detector){while(active){try{for(const x of await detector.detect(el('video'))){found(x.rawValue);break}}catch{}await new Promise(r=>setTimeout(r,180))}}
function setupFocus(track){cameraTrack=track;focusCapabilities=track?.getCapabilities?.()||{};el('refocus').disabled=false;const z=focusCapabilities.zoom;if(z&&Number.isFinite(z.min)&&Number.isFinite(z.max)){el('zoomWrap').style.display='inline-block';el('zoom').min=z.min;el('zoom').max=z.max;el('zoom').step=z.step||0.1;el('zoom').value=track.getSettings?.().zoom||z.min}else el('zoomWrap').style.display='none'}
async function refocus(){const track=cameraTrack;if(!track){say('Start camera first.');return}try{const caps=track.getCapabilities?.()||{};if(caps.focusMode?.includes('single-shot')){await track.applyConstraints({advanced:[{focusMode:'single-shot'}]});say('Refocus requested — hold the barcode steady.')}else if(caps.focusMode?.includes('continuous')){await track.applyConstraints({advanced:[{focusMode:'continuous'}]});say('Autofocus active — move the book slightly farther away, then closer.')}else{say('Manual refocus unavailable on this camera. Move the book farther away and back to trigger autofocus.')}}catch(e){say('Refocus unavailable: '+e.message)}}
async function start(){el('start').disabled=true;say('Requesting camera...');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});el('video').srcObject=stream;await el('video').play();active=true;el('stop').disabled=false;setupFocus(stream.getVideoTracks()[0]);
if('BarcodeDetector' in window){const formats=await BarcodeDetector.getSupportedFormats();if(formats.includes('ean_13')){say('Camera ready — scan ISBN barcode.');scanNative(new BarcodeDetector({formats:['ean_13']}));return}}
say('Loading compatibility scanner...');const script=document.createElement('script');script.src='https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js';await new Promise((ok,fail)=>{script.onload=ok;script.onerror=fail;document.head.append(script)});if(!window.ZXing)throw Error('Scanner library unavailable');stream.getTracks().forEach(t=>t.stop());stream=null;cameraTrack=null;el('refocus').disabled=true;el('zoomWrap').style.display='none';reader=new ZXing.BrowserMultiFormatReader();say('Camera ready — scan ISBN barcode.');reader.decodeFromVideoDevice(undefined,el('video'),result=>{if(result)found(result.getText())}).catch(e=>say('Scanner error: '+e.message))
}catch(e){await stop();say('Could not start camera: '+(e.message||e.name))}}
el('refocus').onclick=refocus;el('zoom').oninput=async e=>{if(!cameraTrack)return;try{await cameraTrack.applyConstraints({advanced:[{zoom:Number(e.target.value)}]})}catch(err){say('Zoom unavailable: '+err.message)}};
window.addEventListener('message', event => {
  if (event.origin !== bridgeContentOrigin || event.data?.source !== 'bookshelf-bridge') return;
  let frame = event.source;
  while (frame && frame !== window && frame !== bridgeFrame?.contentWindow) {
    const parent = frame.parent;
    if (parent === frame) return;
    frame = parent;
  }
  if (!frame || frame !== bridgeFrame?.contentWindow) return;
  const data = event.data;
  if (data.type === 'ready') {
    clearTimeout(bridgeTimer);
    bridgeWindow = event.source;
    bridgeReady = data.connected === true;
    el('bridgeStatus').textContent = bridgeReady ? 'Google Sheets connected.' : 'Enter your private token below to connect.';
    return;
  }
  if (event.source !== bridgeWindow || data.type !== 'result') return;
  const request = pending.get(String(data.id));
  if (!request) return;
  clearTimeout(request.timer);
  pending.delete(String(data.id));
  const result = data.result || {};
  el('saveStatus').textContent = result.ok
    ? result.duplicate ? 'Already in Google Sheets: ' + request.isbn : 'Saved to Google Sheets: ' + (result.title || request.isbn)
    : 'Saved on this phone. Google Sheets: ' + (result.error || 'Unknown error');
});
function connectBridge() {
  clearTimeout(bridgeTimer);
  bridgeReady = false;
  bridgeWindow = null;
  const frame = document.createElement('iframe');
  frame.src = bridgeUrl;
  frame.title = 'Private library connection';
  bridgeFrame = frame;
  el('bridgeStatus').textContent = 'Connecting to Google Sheets…';
  el('bridgeHolder').replaceChildren(frame);
  bridgeTimer = setTimeout(() => {
    el('bridgeStatus').textContent = 'Google Sheets connection timed out. Tap Connect library to retry.';
  }, 15000);
}
el('connectBridge').onclick = connectBridge;
connectBridge();
el('start').onclick=start;el('stop').onclick=()=>{stop();say('Stopped.')};
el('manual').onsubmit=e=>{e.preventDefault();add(el('isbn').value,true);el('isbn').value=''};
el('export').onclick=()=>{const csv='ISBN,Scanned At\n'+scans.map(x=>x.isbn+','+x.at).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='bookshelf-scans.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
el('copy').onclick=async()=>{await navigator.clipboard.writeText(scans.map(x=>x.isbn).join('\n'));say('Copied ISBNs')};
el('clear').onclick=()=>{if(confirm('Clear saved scans on this device?')){scans=[];localStorage.removeItem(key);render()}};
render();
</script></body></html>
